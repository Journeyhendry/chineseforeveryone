name: Casual expression evidence

on:
  workflow_dispatch:
  push:
    paths:
      - data/hsk1/casual-candidates.json
      - scripts/fetch-casual-evidence.ts
      - src/lib/casual.ts
      - .github/workflows/casual-evidence.yml

permissions:
  contents: write

concurrency:
  group: casual-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Tatoeba Mandarin sentences
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tatoeba"
          cd "$RUNNER_TEMP/tatoeba"
          curl -fL --retry 3 --retry-delay 5 -o cmn_sentences.tsv.bz2 \
            https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences.tsv.bz2
          bunzip2 -f cmn_sentences.tsv.bz2
          ls -l

      - name: Fetch evidence
        run: npm run fetch:casual-evidence -- --tatoeba "$RUNNER_TEMP/tatoeba/cmn_sentences.tsv"

      - name: Commit evidence
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hsk1/casual-evidence-raw.json
          if git diff --cached --quiet; then
            echo "No changes in data/hsk1/casual-evidence-raw.json"
            exit 0
          fi
          git commit -m "Data: update casual evidence"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
