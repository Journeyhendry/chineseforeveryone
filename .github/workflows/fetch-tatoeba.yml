name: Fetch Tatoeba sentences

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-tatoeba.yml
      - scripts/filter-sentences.ts
      - src/lib/sentences.ts
      - data/hsk1/units.json
      - data/hsk1/words.json

permissions:
  contents: write

concurrency:
  group: fetch-tatoeba
  cancel-in-progress: false

jobs:
  sentences:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPORTS: https://downloads.tatoeba.org/exports
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Tatoeba exports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tatoeba"
          cd "$RUNNER_TEMP/tatoeba"
          for f in \
            per_language/cmn/cmn_sentences_detailed.tsv.bz2 \
            per_language/eng/eng_sentences_detailed.tsv.bz2 \
            per_language/ind/ind_sentences_detailed.tsv.bz2 \
            per_language/cmn/cmn-eng_links.tsv.bz2 \
            per_language/cmn/cmn-ind_links.tsv.bz2 \
            tags.tar.bz2 \
            sentences_with_audio.tar.bz2 \
            sentences_CC0.tar.bz2
          do
            echo "Downloading $f"
            curl -fL --retry 3 --retry-delay 5 -o "$(basename "$f")" "$EXPORTS/$f"
          done
          ls -l

      - name: Extract
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tatoeba"
          for f in *.tar.bz2; do tar -xjf "$f"; rm "$f"; done
          for f in *.tsv.bz2; do bunzip2 -f "$f"; done
          find . -type f -exec ls -l {} +

      - name: Build sentences
        run: npm run build:sentences -- --in "$RUNNER_TEMP/tatoeba"

      - name: Rebuild lesson files
        run: npm run build:lessons

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild font subset
        run: |
          set -euo pipefail
          python -m pip install -r scripts/font/requirements.txt
          npm run build:font

      - name: Commit sentences
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hsk1/sentences.json data/hsk1/sentences-report.json public/data/hsk1 src/assets/fonts src/styles/fonts.css public/fonts
          if git diff --cached --quiet; then
            echo "No changes in sentences or lesson files"
            exit 0
          fi
          git commit -m "Data: update Tatoeba sentences"
          git pull --rebase origin main
          git push origin HEAD:main
