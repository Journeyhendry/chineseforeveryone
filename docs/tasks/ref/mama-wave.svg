  <path d="M150 128 Q147 138 152 140" fill="none" stroke="#C98B6B" stroke-width="3" stroke-linecap="round"/>
  <path d="M136 150 Q150 162 164 150" fill="#B23A3A" stroke="#231942" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
