<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xué Mandarin: belajar Mandarin dari nol, gratis untuk semua." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap"
    />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('xue.settings.v1') || 'null') || {}
          var d = document.documentElement
          if (s.lang === 'en' || s.lang === 'id') d.lang = s.lang
          var dark =
            s.theme === 'dark' ||
            (s.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          d.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
    <title>Xué Mandarin — belajar Mandarin gratis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
